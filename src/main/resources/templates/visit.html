<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Visit')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('visit')}"></header>
<section class="m-band">
  <div class="m-container m-band__inner">
    <div class="m-heading-block">
      <span class="m-eyebrow m-eyebrow--rule" data-stagger>VISIT US</span>
      <h1 data-lines>On Hotel Road,<br/><em class="m-accent">Mount Lavinia.</em></h1>
    </div>
  </div>
</section>
<main class="m-container m-main" style="padding-top:64px">
  <div class="m-visit">
    <div class="m-stack" style="gap:32px" data-stagger>
      <div class="m-stack" style="gap:10px">
        <span class="m-eyebrow" style="font-size:11px; letter-spacing:.3em">ADDRESS</span>
        <span class="m-visit__address">51, Hotel Road<br/>Mount Lavinia</span>
      </div>
      <div class="m-stack">
        <span class="m-eyebrow" style="font-size:11px; letter-spacing:.3em; margin-bottom:8px">CALL</span>
        <a href="tel:0776682015" class="m-tel">0776-682-015 <span aria-hidden="true">→</span></a>
        <a href="tel:0117162227" class="m-tel">0117-162-227 <span aria-hidden="true">→</span></a>
      </div>
      <a href="/booking/new" class="m-btn m-btn--primary m-btn--md" style="align-self:flex-start" data-ripple>Or book online</a>
    </div>
    <div class="m-visit__media">
      <div class="m-visit__photo" data-stagger><img th:src="@{/img/interior.jpg}" alt="The Mirror salon interior"/></div>
      <div class="m-ph m-map" data-stagger><span class="m-ph__label">map · 51 Hotel Road, Mount Lavinia</span></div>
    </div>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
