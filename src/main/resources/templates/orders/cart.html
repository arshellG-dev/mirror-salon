<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Your Bag')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('shop')}"></header>
<section class="m-band">
  <div class="m-container m-band__inner" style="max-width:820px">
    <div class="m-heading-block">
      <span class="m-eyebrow m-eyebrow--rule" data-stagger>YOUR BAG</span>
      <h1 data-lines>Your <em class="m-accent">bag</em></h1>
    </div>
  </div>
</section>
<main class="m-container m-main" style="max-width:820px">

  <div class="m-price-card" th:unless="${lines.isEmpty()}">
    <div class="m-price-row" th:each="line : ${lines}">
      <div style="min-width:0">
        <span class="m-price-row__name" th:text="${line.product.productName}">Product</span>
        <span class="m-price-row__up" th:text="'Rs. ' + ${#numbers.formatDecimal(line.product.price, 1, 'COMMA', 0, 'POINT')} + ' each'">price</span>
      </div>
      <form th:action="@{/cart/update}" method="post" style="display:flex; gap:6px; align-items:center">
        <input type="hidden" name="productId" th:value="${line.product.productId}"/>
        <input type="number" name="quantity" th:value="${line.quantity}" min="0" class="m-input" style="width:70px; padding:8px 10px"/>
        <button type="submit" class="m-btn m-btn--row" data-ripple>Update</button>
      </form>
      <div class="m-price-row__price">
        <span class="m-price-row__amount" th:text="'Rs. ' + ${#numbers.formatDecimal(line.lineTotal, 1, 'COMMA', 0, 'POINT')}">Rs. 0</span>
      </div>
      <form th:action="@{/cart/remove}" method="post">
        <input type="hidden" name="productId" th:value="${line.product.productId}"/>
        <button type="submit" class="m-link-btn" style="color:#a33" data-ripple>Remove</button>
      </form>
    </div>
  </div>
  <p class="m-body" th:if="${lines.isEmpty()}">Your bag is empty. <a href="/products">Browse the shop →</a></p>

  <div th:unless="${lines.isEmpty()}" style="text-align:right; margin-top:24px">
    <p class="m-h3" style="font-size:24px">Subtotal: Rs. <span th:text="${#numbers.formatDecimal(subtotal, 1, 'COMMA', 0, 'POINT')}">0</span></p>
    <a href="/checkout" class="m-btn m-btn--primary m-btn--lg" data-ripple>Proceed to checkout</a>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
