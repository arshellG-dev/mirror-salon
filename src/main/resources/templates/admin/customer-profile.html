<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Customer Profile')}"></head>
<body class="m-internal">
<div class="m-shell">
  <aside th:replace="~{fragments/internal-layout :: sidebar('customers')}"></aside>
  <div class="m-shell__body">
    <header th:replace="~{fragments/internal-layout :: topbar}"></header>
    <main class="m-shell__content" style="max-width:720px">
      <div class="m-page-head" data-stagger>
        <h1 class="m-h1" style="font-size:32px" th:text="${customer.fullName}">Customer</h1>
        <a href="/admin/customers" class="m-btn m-btn--outline m-btn--sm" data-ripple>&larr; All customers</a>
      </div>
      <div class="m-alert" style="background:rgba(176,141,87,.12); color:var(--c-heading)" th:if="${message}" th:text="${message}"></div>

      <div class="m-price-card" style="margin-bottom:24px">
        <div class="m-price-row"><span class="m-price-row__name">Mobile</span><span th:text="${customer.mobileNo}"></span></div>
        <div class="m-price-row"><span class="m-price-row__name">Registered</span><span th:text="${customer.registeredAt}"></span></div>
        <div class="m-price-row"><span class="m-price-row__name">Source</span><span th:text="${customer.createdVia}"></span></div>
      </div>

      <h3 class="m-h3" style="font-size:18px; margin-bottom:10px">Admin notes</h3>
      <p class="m-body" style="font-size:12.5px; opacity:.7; margin-bottom:10px">Private &mdash; never shown to the customer.</p>
      <form method="post" th:action="@{/admin/customers/{id}/notes(id=${customer.customerId})}" style="display:flex; gap:10px; align-items:flex-start; margin-bottom:32px">
        <textarea class="m-input" name="adminNotes" rows="3" style="flex:1" th:text="${customer.adminNotes}"></textarea>
        <button type="submit" class="m-btn m-btn--primary m-btn--sm" data-ripple>Save</button>
      </form>

      <h3 class="m-h3" style="font-size:18px; margin-bottom:10px">Visit history</h3>
      <table class="m-table">
        <thead><tr><th>Date</th><th>Stylist</th><th>Service(s)</th><th>Price</th><th>Status</th></tr></thead>
        <tbody>
        <tr th:each="b : ${visits}">
          <td th:text="${b.bookingDate}">date</td>
          <td th:text="${b.stylist.staff.fullName}">Stylist</td>
          <td><span th:each="bs, iter : ${b.services}"><span th:text="${bs.service.serviceName}">Service</span><span th:unless="${iter.last}">, </span></span></td>
          <td th:text="'Rs. ' + ${#numbers.formatDecimal(#aggregates.sum(b.services.![priceAtBooking]), 1, 'COMMA', 0, 'POINT')}">Rs. 0</td>
          <td><span th:replace="~{fragments/internal-layout :: statusBadge(${b.status})}"></span></td>
        </tr>
        </tbody>
      </table>
      <p class="m-body" th:if="${visits.isEmpty()}">No visits recorded yet.</p>
    </main>
  </div>
</div>
<script th:replace="~{fragments/internal-layout :: scripts}"></script>
</body>
</html>
