<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${product.productName})}"></head>
<body>
<header th:replace="~{fragments/layout :: header('shop')}"></header>
<main class="m-container" style="padding-top:40px; padding-bottom:100px">
  <a href="/products" class="m-link-btn m-link-btn--back" style="display:inline-block; margin-bottom:24px; padding:10px 14px 10px 0; font-size:11.5px; letter-spacing:.22em" data-ripple>← Shop</a>
  <div class="m-detail">
    <div class="m-detail__media">
      <div class="m-ph m-ph--1x1 m-ph--product" style="border-radius:var(--r-card); box-shadow:var(--sh-card)"><span class="m-ph__label">product shot</span></div>
    </div>
    <div class="m-detail__content">
      <div class="m-heading-block">
        <span class="m-eyebrow" th:text="${product.category.categoryName}">Category</span>
        <h1 class="m-h1 m-h1--detail" th:text="${product.productName}">Product</h1>
        <p class="m-body" th:text="${product.description}">Description</p>
      </div>
      <div class="m-price-card">
        <div class="m-price-row" style="border-bottom:none">
          <div style="min-width:0"><span class="m-price-row__name">Price</span></div>
          <div class="m-price-row__price">
            <span class="m-price-row__amount" th:text="'Rs. ' + ${#numbers.formatDecimal(product.price, 1, 'COMMA', 0, 'POINT')}">Rs. 0</span>
          </div>
        </div>
        <div class="m-price-row">
          <div style="min-width:0"><span class="m-price-row__name">Availability</span></div>
          <div class="m-price-row__price">
            <span class="m-price-row__amount" style="color:var(--c-gold)" th:text="${product.stockQty > 0} ? 'In stock' : 'Out of stock'">Stock</span>
          </div>
        </div>
      </div>
      <form th:action="@{/cart/add}" method="post" th:if="${product.stockQty > 0}" style="display:flex; gap:10px; align-items:center">
        <input type="hidden" name="productId" th:value="${product.productId}"/>
        <input type="number" name="quantity" value="1" min="1" th:max="${product.stockQty}" class="m-input" style="max-width:100px"/>
        <button type="submit" class="m-btn m-btn--primary m-btn--lg" data-ripple>Add to bag</button>
      </form>
    </div>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
