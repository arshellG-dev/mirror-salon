<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Book')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('')}"></header>
<main class="m-container" style="padding-top:56px; padding-bottom:100px">
  <div class="m-heading-block" style="margin-bottom:36px" data-stagger>
    <span class="m-eyebrow">RESERVE YOUR CHAIR</span>
    <h1 class="m-h1">Book an appointment</h1>
  </div>
  <div th:replace="~{booking/fragments/stepper :: stepper(${step})}"></div>

  <div class="m-booking">
    <div class="m-booking__main">
      <h3 class="m-h3">Choose your service(s)</h3>
      <p class="m-body" style="font-size:14px; opacity:.8">You can pick more than one for this visit.</p>
      <div class="m-alert" th:if="${error}" style="color:#a33" th:text="${error}"></div>
      <form method="post" th:action="@{/booking/services}">
        <div class="m-options">
          <label class="m-option" th:each="s : ${services}" style="cursor:pointer">
            <input type="checkbox" name="serviceIds" th:value="${s.serviceId}" th:checked="${selectedIds.contains(s.serviceId)}"/>
            <span style="flex:1">
              <span class="m-option__section" th:text="${s.category.categoryName}">Category</span>
              <span class="m-option__name" th:text="${s.serviceName} + ' &middot; ' + ${s.durationMins} + ' mins'">Service</span>
            </span>
            <span class="m-option__price" th:text="'Rs. ' + ${#numbers.formatDecimal(s.price, 1, 'COMMA', 0, 'POINT')}">Rs. 0</span>
          </label>
        </div>
        <div class="m-booking__actions">
          <a href="/services" class="m-link-btn" style="font-size:11.5px; letter-spacing:.22em; padding:12px 8px" data-ripple>← All services</a>
          <button type="submit" class="m-btn m-btn--primary" style="padding:16px 28px; letter-spacing:.2em" data-ripple>Continue →</button>
        </div>
      </form>
    </div>
    <aside class="m-summary">
      <span class="m-eyebrow" style="letter-spacing:.32em">YOUR BOOKING</span>
      <div class="m-summary__block"><span class="m-summary__label">WHERE</span><span style="font-size:15px; line-height:1.5">51, Hotel Road, Mount Lavinia</span></div>
    </aside>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
