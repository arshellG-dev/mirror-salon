<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Book')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('')}"></header>
<section class="m-band">
  <div class="m-container m-band__inner">
    <div class="m-heading-block">
      <span class="m-eyebrow m-eyebrow--rule" data-stagger>RESERVE YOUR CHAIR</span>
      <h1 data-lines>Book an <em class="m-accent">appointment</em></h1>
    </div>
  </div>
</section>
<main class="m-container m-main">
  <div th:replace="~{booking/fragments/stepper :: stepper(${step})}"></div>

  <div class="m-booking">
    <div class="m-booking__main">
      <h3 class="m-h3">Choose your stylist</h3>
      <form method="post" th:action="@{/booking/stylist}">
        <div class="m-options">
          <label class="m-option">
            <input type="radio" name="stylistId" value="0" checked="checked"/>
            <span style="flex:1"><span class="m-option__name">Any available stylist</span></span>
          </label>
          <label class="m-option" th:each="s : ${qualifiedStylists}">
            <input type="radio" name="stylistId" th:value="${s.staffId}"/>
            <span style="flex:1"><span class="m-option__name" th:text="${s.fullName}">Stylist</span></span>
          </label>
        </div>
        <div class="m-booking__actions">
          <a href="/booking/new" class="m-link-btn" style="font-size:11.5px; letter-spacing:.22em; padding:12px 8px" data-ripple>← Back</a>
          <button type="submit" class="m-btn m-btn--primary" style="padding:16px 28px; letter-spacing:.2em" data-ripple>Continue →</button>
        </div>
      </form>
    </div>
    <aside class="m-summary">
      <span class="m-eyebrow" style="letter-spacing:.32em">YOUR BOOKING</span>
      <div class="m-summary__block"><span class="m-summary__label">WHERE</span><span style="font-size:15px; line-height:1.5">51, Hotel Road, Mount Lavinia</span></div>
    </aside>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
