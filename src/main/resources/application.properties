spring.application.name=salon

spring.profiles.active=local

spring.jpa.hibernate.ddl-auto=validate
# The MariaDB server here negotiates cp850 (a DOS codepage) as the default
# connection charset unless told otherwise, corrupting any non-ASCII text
# (e.g. em dashes) even though the database/tables are utf8mb4. Force it.
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

spring.thymeleaf.cache=false

server.port=8080

# File upload limits (bank transfer deposit slips)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.uploads.dir=uploads/slips
app.otp.demo-mode=true
